name: Daily Scanner v2
 
on:
  schedule:
    # 23:00 UTC = 翌日 08:00 JST
    # 曜日 0=日曜〜4=木曜 → JSTの月〜金の朝8:00
    - cron: '0 23 * * 0-4'
  workflow_dispatch:
 
# GitHub Pagesへのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Run Daily Scanner v2
        env:
          TZ: Asia/Tokyo
        run: |
          python daily_scanner_v2.py \
            --capital 1000000 \
            --risk 1.0 \
            --max-positions 10 \
            --current-positions 0
 
      - name: Setup Pages
        uses: actions/configure-pages@v5
 
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
